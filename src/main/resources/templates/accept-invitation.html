<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: head('Accept Invitation')}"></head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto">
            
            <!-- Error Page (Invalid/Expired/Already Accepted Invitation) -->
            <div th:if="${showForm == false}" class="bg-white rounded-lg shadow p-8 text-center">
                <!-- Error Icon -->
                <div th:if="${errorTitle == 'Invitation Already Accepted'}" 
                     class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                
                <div th:if="${errorTitle == 'Invitation Expired'}" 
                     class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                
                <div th:if="${errorTitle == 'Invalid Invitation'}" 
                     class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </div>
                
                <h1 class="text-2xl font-bold text-gray-800 mb-2" th:text="${errorTitle}"></h1>
                <p class="text-gray-600 mb-6" th:text="${error}"></p>
                <p class="text-gray-500 text-sm mb-6" th:text="${errorAction}"></p>
                <a th:href="${actionLink}" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                    <span th:text="${actionText}"></span>
                </a>
            </div>
            
            <!-- Valid Invitation Form -->
            <div th:if="${showForm == true}" class="bg-white rounded-lg shadow p-8">
                <div class="text-center mb-6">
                    <div class="inline-block w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Accept Invitation</h1>
                    <p class="text-gray-600 text-sm mt-1">Welcome <span th:text="${userName}" class="font-semibold"></span></p>
                </div>
                
                <!-- Success Message -->
                <div th:if="${success}" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg text-green-700">
                    <span th:text="${success}"></span>
                </div>
                
                <!-- Error Message -->
                <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                    <span th:text="${error}"></span>
                </div>
                
                <!-- Global Error from BindingResult 
                <div th:if="${#fields.hasErrors('global')}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                    <span th:each="err : ${#fields.errors('global')}" th:text="${err}"></span>
                </div>-->
                
                <form th:action="@{/accept-invitation}" th:object="${acceptRequest}" method="post" class="space-y-6">
                    <input type="hidden" name="token" th:value="${token}">
                    
                    <!-- Password Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Create Password</label>
                        <input type="password" th:field="*{password}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter your password">
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-sm mt-1"></p>
                        <p class="text-xs text-gray-500 mt-1">Password must be at least 8 characters</p>
                    </div>
                    
                    <!-- Confirm Password Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" th:field="*{confirmPassword}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Confirm your password">
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <!-- CAPTCHA Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Security Verification</label>
                        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 space-y-3 sm:space-y-0">
                                <div class="flex-1">
                                    <input type="text" th:field="*{captcha}" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                           placeholder="Enter the code shown">
                                    <p th:if="${#fields.hasErrors('captcha')}" th:errors="*{captcha}" class="text-red-500 text-sm mt-1"></p>
                                </div>
                                <div class="flex-shrink-0">
                                    <div class="relative">
                                        <img id="captchaImage" th:src="@{/captcha-image}" alt="CAPTCHA" 
                                             class="rounded-lg border border-gray-300 h-14 w-40 object-contain cursor-pointer"
                                             onclick="refreshCaptcha()">
                                        <button type="button" onclick="refreshCaptcha()" 
                                                class="absolute top-1/2 -right-8 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 transition">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 text-center">Click image to refresh</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition transform hover:scale-105">
                        Accept Invitation
                    </button>
                </form>
            </div>
            
        </div>
    </div>
    
    <script th:if="${showForm == true}">
        function refreshCaptcha() {
            const captchaImage = document.getElementById('captchaImage');
            captchaImage.src = '/captcha-image?' + new Date().getTime();
            
            const captchaInput = document.querySelector('[name="captcha"]');
            if (captchaInput) {
                captchaInput.value = '';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            refreshCaptcha();
        });
    </script>
</body>
</html>
