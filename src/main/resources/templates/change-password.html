<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: head('Change Password')}"></head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/admin-header :: navbar(${username}, ${role})}"></div>
    
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-lg shadow p-8">
                <div class="text-center mb-6">
                    <div class="inline-block w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Change Password</h1>
                    <p class="text-gray-600 text-sm mt-1">Update your password</p>
                </div>
                
                <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                    <span th:text="${error}"></span>
                </div>
                
                <form th:action="@{/change-password}" th:object="${changeRequest}" method="post" class="space-y-5">
                    <!-- Current Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label>
                        <input type="password" th:field="*{currentPassword}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                               placeholder="Enter current password">
                        <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <!-- New Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                        <input type="password" th:field="*{newPassword}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                               placeholder="Enter new password">
                        <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-red-500 text-sm mt-1"></p>
                        <p class="text-xs text-gray-500 mt-1">Password must be at least 8 characters</p>
                    </div>
                    
                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" th:field="*{confirmPassword}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                               placeholder="Confirm new password">
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <!-- CAPTCHA -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Security Verification</label>
                        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 space-y-3 sm:space-y-0">
                                <div class="flex-1">
                                    <input type="text" th:field="*{captcha}" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                           placeholder="Enter the code shown">
                                    <p th:if="${#fields.hasErrors('captcha')}" th:errors="*{captcha}" class="text-red-500 text-sm mt-1"></p>
                                </div>
                                <div class="flex-shrink-0">
                                    <div class="relative">
                                        <img id="captchaImage" th:src="@{/captcha-image}" alt="CAPTCHA" 
                                             class="rounded-lg border border-gray-300 h-14 w-40 object-contain cursor-pointer"
                                             onclick="refreshCaptcha()">
                                        <button type="button" onclick="refreshCaptcha()" 
                                                class="absolute top-1/2 -right-8 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 text-center">Click image to refresh</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                        Change Password
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        function refreshCaptcha() {
            const captchaImage = document.getElementById('captchaImage');
            captchaImage.src = '/captcha-image?' + new Date().getTime();
            
            const captchaInput = document.querySelector('[name="captcha"]');
            if (captchaInput) {
                captchaInput.value = '';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            refreshCaptcha();
        });
    </script>
</body>
</html>
