<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: head('Visitors')}"></head>
<body class="bg-gray-100">
    <nav th:replace="~{fragments/admin-header :: navbar(${username}, ${role})}"></nav>
    
    <div class="container mx-auto px-4 py-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Visitors</h1>
            <p class="text-gray-600">Manage and view all registered visitors</p>
        </div>
        
        <!-- Search -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <form method="get" class="flex flex-col sm:flex-row gap-3">
                <input type="text" name="search" placeholder="Search by name, email, or phone..." 
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       th:value="${searchTerm}">
                <div class="flex gap-2">
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Search</button>
                    <a href="/admin/visitors" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Reset</a>
                </div>
            </form>
        </div>
        
        <!-- Visitors Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Phone</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">National ID</th>
							<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Age</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Registered</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="visitor : ${visitors}">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900" th:text="${visitor.fullName}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${visitor.email}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${visitor.phoneNumber}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${visitor.nationalId}"></td>
							<td class="px-6 py-4 text-sm text-gray-600">
							    <th:block th:if="${visitor.age != null}">
							        <span th:text="${visitor.age}"></span> Y/O
							    </th:block>
							    <th:block th:unless="${visitor.age != null}">
							        <span>-</span>
							    </th:block>
							</td>
                            <td class="px-6 py-4 text-sm text-gray-500" th:text="${visitor.registrationDate}"></td>
                        </tr>
                        <tr th:if="${visitors == null || visitors.empty}">
                            <td colspan="5" class="px-6 py-8 text-center text-gray-500">No visitors found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div th:if="${totalPages > 0}" class="px-6 py-4 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="text-sm text-gray-600">
                    Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span>
                </div>
                <div class="flex gap-2">
                    <a th:if="${currentPage > 0}" th:href="@{/admin/visitors(page=${currentPage - 1}, size=20, search=${searchTerm})}" 
                       class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">Previous</a>
                    <a th:if="${currentPage + 1 < totalPages}" th:href="@{/admin/visitors(page=${currentPage + 1}, size=20, search=${searchTerm})}" 
                       class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">Next</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
