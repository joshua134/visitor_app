<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: head('Dashboard')}"></head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/admin-header :: navbar(${username}, ${role})}"></div>
    
    <div class="container mx-auto px-4 py-8">
        <!-- Stats Cards -->
		<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 xl:grid-cols-5 gap-4 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Total Visitors</p>
                        <p class="text-2xl font-bold text-gray-800" th:text="${totalVisitors}">0</p>
                    </div>
                    <div class="p-3 bg-blue-100 rounded-full">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Today's Visitors</p>
                        <p class="text-2xl font-bold text-gray-800" th:text="${todayVisitors}">0</p>
                    </div>
                    <div class="p-3 bg-green-100 rounded-full">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">System Users</p>
                        <p class="text-2xl font-bold text-gray-800" th:text="${totalUsers}">0</p>
                    </div>
                    <div class="p-3 bg-purple-100 rounded-full">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">This Month</p>
                        <p class="text-2xl font-bold text-gray-800" th:text="${monthlyVisitors}">0</p>
                    </div>
                    <div class="p-3 bg-yellow-100 rounded-full">
                        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
			
			<div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Active Sessions</p>
                        <p class="text-2xl font-bold text-gray-800" th:text="${activeSessions}">0</p>
                    </div>
                    <div class="p-3 bg-yellow-100 rounded-full">
                        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Welcome Card with Export Buttons -->
        <div class="bg-white rounded-lg shadow p-8 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome back, <span th:text="${username}"></span>!</h2>
                    <p class="text-gray-600">Here's what's happening with your visitor management system today.</p>
                </div>
                <div class="flex gap-3 mt-4 md:mt-0">
                    <button onclick="showExportModal()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                        Export Report
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Recent Visitors -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">Recent Visitors</h3>
                <a href="/admin/visitors" class="text-blue-600 hover:text-blue-800 text-sm">View All →</a>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Phone</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Age</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Registered</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="visitor : ${recentVisitors}">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900" th:text="${visitor.fullName}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${visitor.email}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${visitor.phoneNumber}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600">
                                <th:block th:if="${visitor.age != null}">
                                    <span th:text="${visitor.age}"></span> Y/O
                                </th:block>
                                <th:block th:unless="${visitor.age != null}">
                                    <span>-</span>
                                </th:block>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-500" th:text="${visitor.registrationDate}"></td>
                        </tr>
                        <tr th:if="${recentVisitors.empty}">
                            <td colspan="5" class="px-6 py-8 text-center text-gray-500">No visitors yet</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Export Visitors Report</h3>
                <button onclick="closeExportModal()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date Range (Optional)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="date" id="startDate" class="px-3 py-2 border border-gray-300 rounded-lg">
                        <input type="date" id="endDate" class="px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button onclick="exportExcel()" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                        Export to Excel
                    </button>
                    <button onclick="exportPDF()" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                        Export to PDF
                    </button>
                    <button onclick="printReport()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Print
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function showExportModal() {
            document.getElementById('exportModal').classList.remove('hidden');
            document.getElementById('exportModal').classList.add('flex');
        }
        
        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
            document.getElementById('exportModal').classList.remove('flex');
        }
        
        function exportExcel() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            let url = '/admin/reports/export/excel';
            if (startDate && endDate) {
                url += '?startDate=' + startDate + '&endDate=' + endDate;
            }
            window.location.href = url;
            closeExportModal();
        }
        
        function exportPDF() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            let url = '/admin/reports/export/pdf';
            if (startDate && endDate) {
                url += '?startDate=' + startDate + '&endDate=' + endDate;
            }
            window.location.href = url;
            closeExportModal();
        }
        
        function printReport() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            let url = '/admin/reports/print';
            if (startDate && endDate) {
                url += '?startDate=' + startDate + '&endDate=' + endDate;
            }
            window.open(url, '_blank');
            closeExportModal();
        }
    </script>
</body>
</html>
