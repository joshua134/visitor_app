<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: head('Invite User')}"></head>
<body class="bg-gray-100">
    <nav th:replace="~{fragments/admin-header :: navbar(${username}, ${role})}"></nav>
    
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Invite New User</h1>
                <p class="text-gray-600 mt-1">Send an invitation email to add a new user to the system</p>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <!-- Success/Error Messages -->
                <div th:if="${success}" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg text-green-700">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                    <span th:text="${error}"></span>
                </div>
                
                <form th:action="@{/admin/users/invite}" th:object="${invitation}" method="post" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label>
                        <input type="text" th:field="*{name}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                               placeholder="John Doe">
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address *</label>
                        <input type="email" th:field="*{email}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                               placeholder="user@example.com">
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Role *</label>
                        <select th:field="*{roleId}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">Select a role</option>
                            <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <div class="pt-4 flex gap-3">
                        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Send Invitation</button>
                        <a href="/admin/users" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cancel</a>
                    </div>
                </form>
                
                <div class="mt-6 p-4 bg-gray-50 rounded-lg">
                    <p class="text-sm text-gray-600">
                        <span class="font-semibold">Note:</span> The invited user will receive an email with a temporary password and a link to accept the invitation. The invitation expires in 48 hours.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
