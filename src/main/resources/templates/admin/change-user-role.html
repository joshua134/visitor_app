<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: head('Change User Role')}"></head>
<body class="bg-gray-100">
    <div th:replace="~{fragments/admin-header :: navbar(${username}, ${role})}"></div>

    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Change User Role</h1>
                <p class="text-gray-600 mt-1">Update role for user: <span th:text="${user.name}" class="font-semibold"></span></p>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <!-- Success/Error Messages -->
                <div th:if="${success}" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg text-green-700">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                    <span th:text="${error}"></span>
                </div>
                
                <form th:action="@{/admin/users/{id}/change-role(id=${user.id})}" method="post" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Current Role</label>
                        <input type="text" th:value="${user.roleName}" disabled
                               class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Select New Role</label>
                        <select name="roleId" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Select a role</option>
                            <option th:each="roleItem : ${roles}" 
                                    th:value="${roleItem.id}" 
                                    th:text="${roleItem.name}"
                                    th:selected="${roleItem.id == user.roleId}">
                            </option>
                        </select>
                    </div>
                    
                    <div class="pt-4 flex gap-3">
                        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Update Role</button>
                        <a href="/admin/users" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
