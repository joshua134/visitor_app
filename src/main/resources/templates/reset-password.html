<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Reset Password')}"></head>
<body class="bg-white min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto">
            
            <!-- Error Page (Invalid/Expired/Already Used Token) -->
            <div th:if="${showForm == false}" class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8 text-center">
                <div th:if="${errorTitle == 'Link Already Used'}" 
                     class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                
                <div th:if="${errorTitle == 'Link Expired'}" 
                     class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                
                <div th:if="${errorTitle == 'Invalid Link'}" 
                     class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </div>
                
                <h1 class="text-2xl font-bold text-gray-800 mb-2" th:text="${errorTitle}"></h1>
                <p class="text-gray-600 mb-4" th:text="${error}"></p>
                <p class="text-gray-500 text-sm mb-6" th:text="${errorAction}"></p>
                <a th:href="${actionLink}" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                    <span th:text="${actionText}"></span>
                </a>
            </div>
            
            <!-- Valid Reset Form -->
            <div th:if="${showForm == true}" class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
                <div class="text-center mb-6">
                    <div class="inline-block w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7.5a3 3 0 11-6 0 3 3 0 016 0zM12 12.75c-2.08 0-4.08.64-5.25 1.75m10.5 0c-1.17-1.11-3.17-1.75-5.25-1.75s-4.08.64-5.25 1.75"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Reset Password</h1>
                    <p class="text-gray-600 text-sm mt-1">Hi <span th:text="${userName}" class="font-semibold"></span></p>
                    <p class="text-gray-500 text-xs">Email: <span th:text="${userEmail}"></span></p>
                </div>
                
                <form th:action="@{/reset-password}" th:object="${resetRequest}" method="post" class="space-y-6">
                    <input type="hidden" name="token" th:value="${token}">
                    
                    <!-- Password Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                        <input type="password" th:field="*{password}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter new password">
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-sm mt-1"></p>
                        <p class="text-xs text-gray-500 mt-1">Password must be at least 8 characters</p>
                    </div>
                    
                    <!-- Confirm Password Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" th:field="*{confirmPassword}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Confirm new password">
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <!-- CAPTCHA Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Security Verification</label>
                        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 space-y-3 sm:space-y-0">
                                <div class="flex-1">
                                    <input type="text" th:field="*{captcha}" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                           placeholder="Enter the code shown">
                                    <p th:if="${#fields.hasErrors('captcha')}" th:errors="*{captcha}" class="text-red-500 text-sm mt-1"></p>
                                </div>
                                <div class="flex-shrink-0">
                                    <div class="relative">
                                        <img id="captchaImage" th:src="@{/captcha-image}" alt="CAPTCHA" 
                                             class="rounded-lg border border-gray-300 h-14 w-40 object-contain cursor-pointer"
                                             onclick="refreshCaptcha()">
                                        <button type="button" onclick="refreshCaptcha()" 
                                                class="absolute top-1/2 -right-8 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 text-center">Click image to refresh</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                        Reset Password
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <a href="/login" class="text-sm text-blue-600 hover:text-blue-800">Back to Login</a>
                </div>
            </div>
            
        </div>
    </div>
    
    <script th:if="${showForm == true}">
        function refreshCaptcha() {
            const captchaImage = document.getElementById('captchaImage');
            captchaImage.src = '/captcha-image?' + new Date().getTime();
            
            const captchaInput = document.querySelector('[name="captcha"]');
            if (captchaInput) {
                captchaInput.value = '';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            refreshCaptcha();
        });
    </script>
</body>
</html>
