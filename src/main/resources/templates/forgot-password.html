<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Forgot Password')}"></head>
<body class="bg-white min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Forgot Password</h1>
                <p class="text-gray-600 mt-2">Enter your email to reset your password</p>
            </div>
            
            <!-- Reset Card -->
            <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
                <form th:action="@{/forgot-password}" th:object="${forgotRequest}" method="post" class="space-y-6">
                    <!-- Email Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <input type="email" th:field="*{email}" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="your@email.com">
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    
                    <!-- CAPTCHA Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Security Verification</label>
                        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 space-y-3 sm:space-y-0">
                                <div class="flex-1">
                                    <input type="text" th:field="*{captcha}" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                           placeholder="Enter the code shown">
                                    <p th:if="${#fields.hasErrors('captcha')}" th:errors="*{captcha}" class="text-red-500 text-sm mt-1"></p>
                                </div>
                                <div class="flex-shrink-0">
                                    <div class="relative">
                                        <img id="captchaImage" th:src="@{/captcha-image}" alt="CAPTCHA" 
                                             class="rounded-lg border border-gray-300 h-14 w-40 object-contain cursor-pointer"
                                             onclick="refreshCaptcha()">
                                        <button type="button" onclick="refreshCaptcha()" 
                                                class="absolute top-1/2 -right-8 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 text-center">Click image to refresh</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                        Send Reset Link
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <a href="/login" class="text-sm text-blue-600 hover:text-blue-800">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function refreshCaptcha() {
            const captchaImage = document.getElementById('captchaImage');
            captchaImage.src = '/captcha-image?' + new Date().getTime();
            
            const captchaInput = document.querySelector('[name="captcha"]');
            if (captchaInput) {
                captchaInput.value = '';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            refreshCaptcha();
        });
    </script>
</body>
</html>
