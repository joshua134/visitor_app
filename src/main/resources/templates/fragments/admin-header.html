<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title th:text="${title} + ' | Visitor Management System'"></title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<nav th:fragment="navbar(username, role)" class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-3">
            <!-- Logo -->
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </div>
                <span class="text-lg font-semibold text-gray-800">VisitorMS</span>
            </div>
            
            <!-- Desktop Navigation Links (based on role) -->
            <div class="hidden md:flex items-center space-x-6">
                <a href="/admin/dashboard" class="text-gray-600 hover:text-blue-600 transition">Dashboard</a>
                <a href="/admin/visitors" class="text-gray-600 hover:text-blue-600 transition">Visitors</a>
                
                <!-- Admin only links -->
                <th:block th:if="${role == 'ADMIN'}">
                    <a href="/admin/users" class="text-gray-600 hover:text-blue-600 transition">Users</a>
                </th:block>
            </div>
            
            <!-- User Dropdown Menu -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="flex items-center space-x-2 focus:outline-none">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span class="text-sm font-medium text-blue-600 uppercase" th:text="${#strings.substring(username, 0, 1)}"></span>
                    </div>
                    <span class="text-sm text-gray-700 hidden md:inline" th:text="${username}"></span>
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                
                <!-- Dropdown Menu -->
                <div x-show="open" @click.away="open = false" x-cloak class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
                    <div class="px-4 py-2 border-b border-gray-100">
                        <p class="text-sm font-medium text-gray-900" th:text="${username}"></p>
                        <p class="text-xs text-gray-500" th:text="'Role: ' + ${role}"></p>
                    </div>
                    <form th:action="@{/logout}" method="post" class="block">
                        <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50 transition">
                            Sign Out
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu Button and Navigation -->
        <div class="md:hidden" x-data="{ mobileMenu: false }">
            <button @click="mobileMenu = !mobileMenu" class="text-gray-600 focus:outline-none py-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            
            <div x-show="mobileMenu" x-cloak class="pb-3">
                <a href="/admin/dashboard" class="block px-3 py-2 text-gray-600 hover:bg-gray-50 rounded">Dashboard</a>
                <a href="/admin/visitors" class="block px-3 py-2 text-gray-600 hover:bg-gray-50 rounded">Visitors</a>
                <th:block th:if="${role == 'ADMIN'}">
                    <a href="/admin/users" class="block px-3 py-2 text-gray-600 hover:bg-gray-50 rounded">Users</a>
                </th:block>
            </div>
        </div>
    </div>
    
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</nav>
</html>
