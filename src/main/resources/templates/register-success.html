<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Registration Successful')}"></head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto w-full">
            <div class="bg-white rounded-lg shadow-md p-8 text-center fade-in-up">
                <!-- Success Icon -->
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Registration Successful!</h1>
                <p class="text-gray-600 mb-6">Thank you for registering with us.</p>
                
                <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6 text-left">
                    <div class="flex items-start">
                        <svg class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                        </svg>
                        <div>
                            <p class="font-semibold text-green-800">A confirmation email has been sent to your registered email address.</p>
                            <p class="text-sm text-green-700 mt-1">Please check your inbox (and spam folder) for the confirmation message.</p>
                        </div>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <a href="/" class="block w-full bg-blue-600 text-white text-center font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                        Go to Homepage
                    </a>
                    <a href="/login" class="block w-full bg-gray-200 text-gray-700 text-center font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition duration-300">
                        Sign In
                    </a>
                </div>
                
                <div class="mt-6 pt-6 border-t border-gray-200">
                    <p class="text-sm text-gray-500">
                        Need help? <a href="#" class="text-blue-600 hover:text-blue-800">Contact Support</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
