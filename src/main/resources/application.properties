# Application
spring.application.name=visitor-app

# H2 Database Configuration - File-based
spring.datasource.url=jdbc:h2:file:./data/visitor_app
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# H2 Console
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.h2.console.settings.web-allow-others=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - Disable for H2 (or use H2-compatible scripts)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration/h2
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

app.base-url=${APP_URL}

# Admin Configuration
app.super-admin.email=${ADMIN_EMAIL}
app.super-admin.first-name=System
app.super-admin.last-name=Director
app.super-admin.password=${ADMIN_PASSWORD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Encryption Configuration
encryption.secret.key=${ENCRYPTION_KEY}

# Thymeleaf
spring.thymeleaf.cache=false

# Logging - Production
logging.level.root=INFO
logging.level.com.visitor=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%clr(%d{yyyy-MM-dd:HH:mm:ss}){faint} %clr(%-5level){fatal=red, error=red, warn=yellow, info=blue, debug=green, trace=magenta} %clr([%thread]){cyan} %clr(%logger{36}){yellow} %clr(:){faint} - %msg%n


